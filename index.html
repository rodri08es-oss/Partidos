<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Partidos selecciones</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #topbar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: white;
      border-bottom: 1px solid #ddd;
      box-sizing: border-box;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: calc(100vh - 52px);
    }

    .marker-partidos {
      background: #2563eb;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .popup-partido {
      padding: 4px 0 10px 0;
    }

    .popup-partido + .popup-partido {
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    .popup-titulo {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #111;
    }

    .popup-fecha {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    .popup-estadio {
      font-size: 13px;
      margin-bottom: 3px;
      color: #444;
    }

    .popup-lugar {
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <span id="contador">Cargando partidos...</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Datos -->
  <script src="partidos.js"></script>

  <script>

    const map = L.map('map').setView([42, 2], 5);

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    function escapar(texto) {

      return String(texto ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    }


    function formatearFecha(fechaISO) {

      const partes = fechaISO.split('-');

      const fecha = new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
      );

      return new Intl.DateTimeFormat(
        'es-ES',
        {
          weekday: 'long',
          day: 'numeric',
          month: 'long'
        }
      ).format(fecha);

    }


    if (window.partidos && Array.isArray(window.partidos)) {

      const grupos = {};


      // Agrupar partidos que comparten coordenadas

      window.partidos.forEach(partido => {

        if (
          partido.latitud == null ||
          partido.longitud == null
        ) {
          return;
        }

        const clave =
          partido.latitud + '|' + partido.longitud;


        if (!grupos[clave]) {

          grupos[clave] = {
            latitud: partido.latitud,
            longitud: partido.longitud,
            partidos: []
          };

        }


        grupos[clave].partidos.push(partido);

      });


      const limites = [];


      Object.values(grupos).forEach(grupo => {


        // Ordenar por fecha y hora

        grupo.partidos.sort((a, b) => {

          const fechaA = a.fecha + ' ' + a.hora;
          const fechaB = b.fecha + ' ' + b.hora;

          return fechaA.localeCompare(fechaB);

        });


        let contenidoPopup = '';


        grupo.partidos.forEach(partido => {

          contenidoPopup += `

            <div class="popup-partido">

              <div class="popup-titulo">
                ${escapar(partido.local)}
                vs
                ${escapar(partido.visitante)}
              </div>

              <div class="popup-fecha">
                ${escapar(formatearFecha(partido.fecha))}
                ·
                ${escapar(partido.hora)}
              </div>

              <div class="popup-estadio">
                ${escapar(partido.estadio)}
              </div>

              <div class="popup-lugar">
                ${escapar(partido.provincia)}
                ·
                ${escapar(partido.pais)}
              </div>

            </div>

          `;

        });


        const cantidad = grupo.partidos.length;


        const icono = L.divIcon({

          className: '',

          html: `
            <div class="marker-partidos">
              ${cantidad}
            </div>
          `,

          iconSize: [32, 32],

          iconAnchor: [16, 16]

        });


        L.marker(
          [
            grupo.latitud,
            grupo.longitud
          ],
          {
            icon: icono
          }
        )
        .addTo(map)
        .bindPopup(
          contenidoPopup,
          {
            maxWidth: 400,
            maxHeight: 420
          }
        );


        limites.push([
          grupo.latitud,
          grupo.longitud
        ]);

      });


      document.getElementById('contador').textContent =
        window.partidos.length +
        ' partidos · ' +
        Object.keys(grupos).length +
        ' ubicaciones';


      if (limites.length > 0) {

        map.fitBounds(
          limites,
          {
            padding: [40, 40]
          }
        );

      }


    } else {

      document.getElementById('contador').textContent =
        'Error al cargar partidos.js';

    }

  </script>

</body>
</html>
